name: Publish

on:
  push:
    branches: [main]
    paths:
      - '*/Project/Sources/**/*.4dm'
      - '*/Project/Sources/*/*.4DForm'
      - '*/Project/Sources/*.4DCatalog'
      - '*/Project/Resources/**'
      - 'TEI/Resources/**'
  workflow_dispatch:
    inputs:
      use_self_hosted:
        type: boolean
        description: Use a self-hosted Mac for component compilation and signing
        required: true
        default: false
      mode:
        type: choice
        description: Component semantic version increment
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  project_path: TEI/Project/TEI.4DProject

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main for component publication
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Publish must run from main."
            exit 1
          fi

  native:
    needs: guard
    uses: ./.github/workflows/build-native.yml

  publish:
    needs: native
    permissions:
      contents: write
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted","macos"]') || fromJSON('["macos-15"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure
        id: configure
        uses: miyako/4D/.github/actions/bash/configure@v1
        with:
          mode: ${{ inputs.mode || 'patch' }}

      - name: Increment component version without rebasing onto unbuilt source
        id: version
        env:
          VERSION_MODE: ${{ inputs.mode || 'patch' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          npm version "$VERSION_MODE" --no-git-tag-version
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: native-component
          path: native-component

      - name: Install fresh server resources, never stale checked-in binaries
        shell: bash
        run: |
          set -euo pipefail
          test -s native-component/macOS/text-embeddings-router
          test -s native-component/Windows/text-embeddings-router.exe
          cp native-component/macOS/* TEI/Resources/bin/macOS/
          cp native-component/Windows/* TEI/Resources/bin/Windows/
          chmod +x TEI/Resources/bin/macOS/text-embeddings-router
          lipo TEI/Resources/bin/macOS/text-embeddings-router -verify_arch arm64 x86_64
          TEI/Resources/bin/macOS/text-embeddings-router --version

      - name: Get tool version
        id: tool
        uses: miyako/4D/.github/actions/tool4d-get-version@v1

      - name: Get tool4d
        uses: miyako/4D/.github/actions/tool4d-download@v1
        with:
          platform: ${{ steps.tool.outputs.platform }}
          branch: ${{ steps.tool.outputs.branch }}
          version: ${{ steps.tool.outputs.version }}
          build: ${{ steps.tool.outputs.build }}
          arch: ${{ steps.tool.outputs.arch }}

      - name: Build component
        id: build
        uses: miyako/4D/.github/actions/build-component@v1
        with:
          project_path: ${{ steps.configure.outputs.project_path }}
          pack_project: 'true'
          use_standard_zip: 'true'

      - name: Setup signing keychain
        id: keychain
        uses: miyako/4D/.github/actions/deployment-setup-keychain@v1
        with:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Sign, verify, notarize and archive the complete component
        env:
          PRODUCT_PATH: ${{ steps.build.outputs.product_path }}
          SIGNING_IDENTITY: ${{ secrets.CODESIGN_APPLE_ID }}
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          server="$PRODUCT_PATH/Resources/bin/macOS/text-embeddings-router"
          windows="$PRODUCT_PATH/Resources/bin/Windows/text-embeddings-router.exe"
          test -s "$server"
          cmp native-component/macOS/text-embeddings-router "$server"
          cmp native-component/Windows/text-embeddings-router.exe "$windows"
          chmod +x "$server"
          python3 scripts/sign_component.py "$PRODUCT_PATH"
          export SIGNED_SERVER="$server"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          binary = Path(os.environ["SIGNED_SERVER"])
          manifest = binary.parent / "build-info.json"
          info = json.loads(manifest.read_text())
          info["packaged_binary_sha256"] = hashlib.sha256(binary.read_bytes()).hexdigest()
          info["macos_signing"] = "Developer ID signed; see release notarization.json for DMG acceptance"
          manifest.write_text(json.dumps(info, indent=2) + "\n")
          PY
          hdiutil create -format UDBZ -srcfolder "$PRODUCT_PATH" TEI.dmg
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" TEI.dmg
          codesign --verify --strict --verbose=2 TEI.dmg
          bash scripts/notarize.sh TEI.dmg
          ditto -c -k --keepParent "$PRODUCT_PATH" TEI.zip

      - name: Preserve Apple notarization diagnostics even on rejection
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: component-notarization
          path: |
            notarization.json
            notarization-log.json
            component-signing.json
          if-no-files-found: warn

      - name: Commit only component version and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "$VERSION" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
          gh release create "$VERSION" TEI.dmg TEI.zip notarization.json component-signing.json \
            --target "$(git rev-parse HEAD)" --draft --title "$VERSION" \
            --notes "4D component with native TEI built from native-source.json at builder commit $GITHUB_SHA. See Resources/bin/*/build-info.json for exact upstream source and backend provenance."
          gh release edit "$VERSION" --draft=false --latest=true

      - name: Remove signing keychain
        if: ${{ always() && steps.keychain.outputs.KEYCHAIN_PATH != '' }}
        env:
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
          CERTIFICATE_PATH: ${{ steps.keychain.outputs.CERTIFICATE_PATH }}
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
