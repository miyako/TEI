theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /TEI

title: "Text Embeddings Inference"
description: "Local embeddings with Hugging Face Text Embeddings Inference. Run a local server or integrate it with 4D."
url: "https://miyako.github.io"
logo: "/assets/tei.png"
component_version: "20.1.6"
show_downloads: false      # component releases are linked from the home page
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/TEI"
  is_project_page: false

exclude:
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "SITE-DESIGN.md"
  - "package.json"
  - "Gemfile"
  - "scripts"
  - "native-source.json"
